<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" fill="none">
  <title>포근한 햇살밭</title>
  <desc>크림빛 하늘, 솜구름, 잎사귀 언덕과 작은 해바라기 등대가 있는 밭뭉치의 정원.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e4f3e9"/><stop offset=".36" stop-color="#f6f8e7"/><stop offset=".76" stop-color="#fff9e9"/><stop offset="1" stop-color="#f1eccf"/></linearGradient>
    <radialGradient id="sun-halo"><stop stop-color="#fff4c6" stop-opacity=".85"/><stop offset=".5" stop-color="#fff6dc" stop-opacity=".35"/><stop offset="1" stop-color="#fff5d9" stop-opacity="0"/></radialGradient>
    <radialGradient id="felt-sun" cx=".35" cy=".28" r=".85"><stop stop-color="#fff9d6"/><stop offset=".58" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f5d68a"/></radialGradient>
    <radialGradient id="cream-cloud" cx=".34" cy=".17" r=".9"><stop stop-color="#fffef8"/><stop offset=".56" stop-color="#fcfbef"/><stop offset="1" stop-color="#dfe9d9"/></radialGradient>
    <linearGradient id="mint-hill" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#d3e5c8"/><stop offset="1" stop-color="#dfead0"/></linearGradient>
    <linearGradient id="cream-hill" x1=".3" y1="0" x2=".8" y2="1"><stop stop-color="#eeeac7"/><stop offset="1" stop-color="#e6e5bb"/></linearGradient>
    <linearGradient id="near-hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c2dba9"/><stop offset="1" stop-color="#d5e3b9"/></linearGradient>
    <radialGradient id="leaf" cx=".32" cy=".22" r=".93"><stop stop-color="#ecf5ce"/><stop offset=".35" stop-color="#cce3a9"/><stop offset="1" stop-color="#9cbe80"/></radialGradient>
    <radialGradient id="sage-leaf" cx=".32" cy=".22" r=".93"><stop stop-color="#d7ebcf"/><stop offset=".42" stop-color="#b3d5ac"/><stop offset="1" stop-color="#87b18e"/></radialGradient>
    <radialGradient id="peach-petal" cx=".3" cy=".2" r=".9"><stop stop-color="#fff2db"/><stop offset=".45" stop-color="#f6d3af"/><stop offset="1" stop-color="#dfae8e"/></radialGradient>
    <radialGradient id="rose-petal" cx=".33" cy=".2" r=".9"><stop stop-color="#fff1e8"/><stop offset=".45" stop-color="#f3d0cb"/><stop offset="1" stop-color="#d8aeb5"/></radialGradient>
    <radialGradient id="daisy-petal" cx=".35" cy=".2" r=".9"><stop stop-color="#fffef3"/><stop offset=".65" stop-color="#faf0d7"/><stop offset="1" stop-color="#e1d6b7"/></radialGradient>
    <radialGradient id="flower-center" cx=".33" cy=".2" r=".95"><stop stop-color="#fff2bf"/><stop offset=".5" stop-color="#f4d990"/><stop offset="1" stop-color="#dbb874"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf0d5"/><stop offset=".55" stop-color="#ecdab4"/><stop offset="1" stop-color="#dbc39a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#edf8e8"/><stop offset=".55" stop-color="#d0e5d0"/><stop offset="1" stop-color="#b6d4bf"/></linearGradient>
    <radialGradient id="shadow"><stop stop-color="#7a8f5b" stop-opacity=".19"/><stop offset="1" stop-color="#7a8f5b" stop-opacity="0"/></radialGradient>
    <pattern id="linen" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 2H8M2 0V8" stroke="#928c60" stroke-opacity=".024" stroke-width=".6"/></pattern>
    <g id="cloud">
      <path d="M-86 25C-111 24-119 7-111-10C-105-25-89-29-74-22C-76-45-57-61-38-56C-23-82 12-78 26-56C50-62 71-45 72-24C95-33 118-15 114 6C110 24 94 30 71 30Z" fill="url(#cream-cloud)" stroke="#fffef7" stroke-width="2"/>
      <path d="M-95 14C-81 22-67 20-52 21H74C88 21 98 17 104 9" stroke="#d4dfc9" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 6"/>
      <path d="M-70-25C-67-44-52-50-40-47M-24-60C-7-70 10-64 17-56" stroke="#fffef9" stroke-width="4" stroke-linecap="round" opacity=".66"/>
