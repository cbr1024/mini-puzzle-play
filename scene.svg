        <ellipse cy="-25" rx="12" ry="24"/><ellipse cy="-25" rx="12" ry="24" transform="rotate(45)"/><ellipse cy="-25" rx="12" ry="24" transform="rotate(90)"/><ellipse cy="-25" rx="12" ry="24" transform="rotate(135)"/><ellipse cy="-25" rx="12" ry="24" transform="rotate(180)"/><ellipse cy="-25" rx="12" ry="24" transform="rotate(225)"/><ellipse cy="-25" rx="12" ry="24" transform="rotate(270)"/><ellipse cy="-25" rx="12" ry="24" transform="rotate(315)"/>
      </g>
      <circle r="19" fill="url(#flower-center)" stroke="#f7e9b2" stroke-width="1.4"/>
    </g>
  </defs>

  <path d="M0 0H1600V1100H0Z" fill="url(#sky)"/>
