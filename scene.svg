    <ellipse cy="139" rx="111" ry="19" fill="url(#shadow)"/>
    <path d="M-77 128V37C-77-1-45-30 0-30C45-30 77-1 77 37V128Z" fill="url(#glass)" stroke="#fff8df" stroke-width="7"/>
    <path d="M-77 51H77M-77 94H77M0-29V128M-41-18V128M41-18V128" stroke="#f1edce" stroke-width="5"/>
    <path d="M-16 131V84Q-16 67 0 67Q16 67 16 84V131" fill="#e9eed4" stroke="#fff6dc" stroke-width="5"/>
    <path d="M-48 117H-26M25 117H48" stroke="#b5bc88" stroke-width="8" stroke-linecap="round"/>
    <path d="M-38 112V101M35 112V102" stroke="#99b780" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M-38 103Q-51 101-48 93Q-36 91-38 103M35 104Q46 104 47 95Q36 92 35 104" fill="#acd09b"/>
    <path d="M-61 34Q-60 9-42-4" stroke="#fffff3" stroke-width="4" stroke-linecap="round" opacity=".65"/>
    <path d="M-84 131H85" stroke="#d5cca1" stroke-width="9" stroke-linecap="round"/>
  </g>
  <path d="M1150 950C1188 951 1258 977 1320 1008" stroke="#edf7e6" stroke-width="30" stroke-linecap="round" opacity=".72"/>
  <path d="M1150 950C1188 951 1258 977 1320 1008" stroke="#c7dfc9" stroke-width="18" stroke-linecap="round" opacity=".72"/>
  <path d="M1168 951L1181 953M1226 971L1242 977M1291 996L1303 1002" stroke="#fff9e4" stroke-width="3" stroke-linecap="round" opacity=".65"/>

