    <path d="M-21 62H32M-23 106H34M-25 151H36" stroke="#dfc693" stroke-width="4" stroke-linecap="round"/>
    <path d="M-5 177V150A12 12 0 0 1 19 150V177" fill="#aabc8a" stroke="#fff2d0" stroke-width="4"/>
    <path d="M0 94V79A8 8 0 0 1 16 79V94Z" fill="url(#glass)" stroke="#fff4d8" stroke-width="3.5"/>
    <g transform="translate(5 1)">
      <g fill="url(#flower-center)" stroke="#ffefb9" stroke-width="1.6"><ellipse cy="-29" rx="13" ry="24"/><ellipse cy="-29" rx="13" ry="24" transform="rotate(45)"/><ellipse cy="-29" rx="13" ry="24" transform="rotate(90)"/><ellipse cy="-29" rx="13" ry="24" transform="rotate(135)"/><ellipse cy="-29" rx="13" ry="24" transform="rotate(180)"/><ellipse cy="-29" rx="13" ry="24" transform="rotate(225)"/><ellipse cy="-29" rx="13" ry="24" transform="rotate(270)"/><ellipse cy="-29" rx="13" ry="24" transform="rotate(315)"/></g>
      <circle r="23" fill="#e5d4a7" stroke="#f7eac6" stroke-width="4"/><path d="M0-12L4-3 13 0 4 4 0 13-4 4-13 0-4-3Z" fill="#fff6c9"/>
    </g>
    <path d="M-15 27V52M-16 116V135" stroke="#fff8e0" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>

