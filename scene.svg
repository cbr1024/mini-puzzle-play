    <path d="M-1 0C-26-62-29-126-10-207" stroke="#d9e7bb" stroke-width="3" stroke-linecap="round"/>
    <use href="#leaf-sprig" transform="translate(-22 -109) rotate(102) scale(1.02)"/>
    <use href="#leaf-wide" transform="translate(-20 -148) rotate(0) scale(.74)"/>
    <use href="#flower-peach" transform="translate(-10 -231) rotate(11) scale(1.4)"/>
    <path d="M-89 14Q-83-41-108-82" stroke="#b7c99a" stroke-width="7" stroke-linecap="round"/>
    <use href="#leaf-sprig" transform="translate(-89 -25) rotate(91) scale(.66)"/>
    <use href="#daisy" transform="translate(-112 -101) rotate(-17) scale(.66)"/>
    <use href="#leaf-wide" transform="translate(70 23) rotate(86) scale(1.3)"/>
    <use href="#leaf-sprig" transform="translate(76 17) rotate(10) scale(1.4)"/>
    <use href="#leaf-wide" transform="translate(-30 30) rotate(80) scale(1.1)"/>
  </g>
  <g opacity=".48" fill="#e3c799"><ellipse cx="238" cy="1013" rx="12" ry="5" transform="rotate(-11 238 1013)"/><ellipse cx="1386" cy="1058" rx="15" ry="5"/><ellipse cx="287" cy="1054" rx="8" ry="4"/></g>
  <g fill="#fffdf2" opacity=".8"><path d="M390 364L393 373 402 376 393 379 390 388 387 379 378 376 387 373Z"/><path d="M1230 476L1232 482 1238 484 1232 486 1230 492 1228 486 1222 484 1228 482Z"/><path d="M157 588L159 594 165 596 159 598 157 604 155 598 149 596 155 594Z"/></g>
