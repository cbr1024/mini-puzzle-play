    <ellipse cy="-13" rx="107" ry="23" fill="url(#shadow)"/>
    <path d="M0 0C24-87 21-145-4-222" stroke="#afc18b" stroke-width="12" stroke-linecap="round"/>
    <path d="M-2-8C19-83 18-142-6-217" stroke="#d6e4b3" stroke-width="3" stroke-linecap="round"/>
