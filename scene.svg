  <ellipse cx="805" cy="476" rx="455" ry="526" fill="#fffdf2" opacity=".3"/>
  <!-- A tiny embroidered sun smiles over the garden, away from the game grid. -->
  <g transform="translate(258 157)" opacity=".82">
    <g stroke="#efdba0" stroke-width="5" stroke-linecap="round"><path d="M0-88V-100M62-62L72-72M88 0H100M62 62L72 72M-62 62L-72 72M-88 0H-100M-62-62L-72-72"/></g>
    <circle r="65" fill="url(#felt-sun)" stroke="#fffae3" stroke-width="2"/>
    <circle r="56" stroke="#e7ca8b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 5" opacity=".55"/>
    <path d="M-18 2Q-13-4-8 2M8 2Q13-4 18 2M-4 12Q0 16 4 12" stroke="#b49964" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="-25" cy="12" rx="7" ry="3.7" fill="#efc6a0" opacity=".55"/><ellipse cx="25" cy="12" rx="7" ry="3.7" fill="#efc6a0" opacity=".55"/>
    <path d="M-35-32Q-25-46-10-46" stroke="#fffce6" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>
  <g opacity=".5" stroke-linecap="round">
    <path d="M1260 252C1260 142 1350 65 1460 65" stroke="#efd2bd" stroke-width="17"/>
    <path d="M1283 252C1283 157 1367 88 1460 88" stroke="#f2e1ac" stroke-width="16"/>
    <path d="M1305 252C1305 174 1381 110 1460 110" stroke="#cbdcba" stroke-width="15"/>
    <path d="M1327 252C1327 190 1397 132 1460 132" stroke="#c8ded7" stroke-width="14"/>
  </g>
  <use href="#cloud" transform="translate(256 285) scale(1.11)" opacity=".95"/>
  <use href="#cloud" transform="translate(1393 282) scale(1.13)" opacity=".95"/>
  <use href="#cloud" transform="translate(104 452) scale(.47)" opacity=".56"/>
  <use href="#cloud" transform="translate(1104 136) scale(.53)" opacity=".65"/>

  <!-- Rounded, sewn landscape panels leave the middle high and quiet. -->
  <path d="M0 868C118 751 254 757 393 893C533 1029 665 1008 815 977C1040 929 1217 772 1393 821C1496 850 1548 904 1600 907V1100H0Z" fill="url(#mint-hill)"/>
  <path d="M0 927C128 829 270 869 402 994C547 1132 866 1130 1088 1003C1255 908 1459 861 1600 986V1100H0Z" fill="url(#cream-hill)"/>
  <path d="M0 1032C166 934 311 972 451 1052C620 1148 806 1119 976 1067C1205 998 1407 1018 1600 1047V1100H0Z" fill="url(#near-hill)"/>
