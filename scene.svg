    <use href="#leaf-wide" transform="translate(14 -146) rotate(106) scale(.75)"/>
    <use href="#flower-rose" transform="translate(-5 -245) rotate(-12) scale(1.35)"/>
    <path d="M84 8Q90-57 125-103" stroke="#b9c99a" stroke-width="7" stroke-linecap="round"/>
    <use href="#leaf-wide" transform="translate(103 -45) rotate(9) scale(.53)"/>
    <use href="#daisy" transform="translate(132 -115) rotate(12) scale(.7)"/>
    <use href="#leaf-wide" transform="translate(-51 22) rotate(12) scale(1.2)"/>
    <use href="#leaf-sprig" transform="translate(-45 15) rotate(85) scale(1.6)"/>
    <use href="#leaf-wide" transform="translate(47 30) rotate(45) scale(1.1)"/>
  </g>
