      <circle r="15" stroke="#d0b274" stroke-opacity=".4" stroke-width="1" stroke-dasharray="1 4" stroke-linecap="round"/>
      <path d="M-7-9Q0-14 7-8" stroke="#fff6cf" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="flower-rose">
      <g fill="url(#rose-petal)" stroke="#fff2e5" stroke-width="1">
        <ellipse cy="-23" rx="16" ry="25"/><ellipse cy="-23" rx="16" ry="25" transform="rotate(72)"/><ellipse cy="-23" rx="16" ry="25" transform="rotate(144)"/><ellipse cy="-23" rx="16" ry="25" transform="rotate(216)"/><ellipse cy="-23" rx="16" ry="25" transform="rotate(288)"/>
      </g>
      <circle r="18" fill="url(#flower-center)" stroke="#fce9ba" stroke-width="1.5"/>
      <path d="M-6-8Q0-12 6-8" stroke="#fff5d4" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="daisy">
